<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTK 2nd Depth Motion</title>
<style>
  @font-face {
    font-family: 'Pretendard Variable';
    src: url('assets/PretendardVariable.woff2') format('woff2-variations');
    font-weight: 45 920;
    font-display: swap;
  }

  /* Hub Design System 토큰 (Light) */
  :root {
    --background: #FFFFFF;
    --foreground: #111111;
    --popover: #FFFFFF;
    --primary: #111111;
    --primary-foreground: #FFFFFF;
    --secondary: #F7F7F7;
    --muted: #F7F7F7;
    --muted-foreground: #909090;
    --accent: #F7F7F7;
    --destructive: #FF334B;
    --success: #06C755;
    --border: #EFEFEF;
    --input: #EFEFEF;
    --radius-xl: 14px;
    --radius-2xl: 18px;
    --radius-3xl: 22px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--background);
    color: var(--foreground);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── 상단 바 ─────────────────────────── */
  .topbar {
    flex: 0 0 auto;
    padding: 16px 24px 13px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 6px;
  }
  .topbar .title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .topbar .title small {
    display: block;
    margin-top: 5px;
    font-size: 13px;
    font-weight: 400;
    color: var(--muted-foreground);
  }

  .iconbtn {
    width: 32px; height: 32px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--foreground);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .iconbtn:hover { background: var(--accent); }
  .iconbtn svg { width: 17px; height: 17px; }
  .iconbtn.active { background: var(--secondary); }
  .iconbtn.rec .stop { display: none; }
  .iconbtn.rec.recording { animation: pulse 1.2s ease-in-out infinite; }
  .iconbtn.rec.recording .dot { display: none; }
  .iconbtn.rec.recording .stop { display: block; }
  .iconbtn.rec:disabled { opacity: .35; cursor: default; }
  @keyframes pulse { 50% { opacity: .5; } }

  /* ── 스테이지 ─────────────────────────── */
  .main {
    flex: 1;
    display: flex;
    align-items: center;       /* 세로 중앙 + 살짝 위로 (옵티컬 센터) */
    justify-content: center;
    overflow: hidden;
    padding-bottom: 4vh;
  }
  .stage { flex: 0 0 auto; display: flex; gap: 56px; }
  @media (max-width: 700px) {
    .topbar { padding: 16px 20px 6px; }
    .topbar .title { font-size: 17px; }
    .main { justify-content: flex-start; overflow-x: auto; padding: 0 16px 2vh; -webkit-overflow-scrolling: touch; }
  }
  .devicewrap { display: flex; flex-direction: column; gap: 4px; }
  .devhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 36px;
    padding-left: 4px;
  }
  .devhead .caption { font-size: 12px; font-weight: 600; color: var(--muted-foreground); }
  .devhead .devbtns { display: flex; gap: 2px; }

  .device {
    width: 375px;
    height: 812px;
    flex: 0 0 auto;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    background: #fff;
    outline: 1px solid var(--border);
  }
  .device.recording { outline: none; }
  .viewport {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
  }
  .viewport::-webkit-scrollbar { display: none; }
  .content { display: block; width: 375px; margin-top: 98px; }

  /* 소프트 엣지 — 리퀴드 글라스 톤: 화이트 틴트 최소화 + 점진 블러 위주 */
  .softedge {
    position: absolute;
    top: 0; left: 0;
    width: 375px; height: 88px;
    pointer-events: none;
    z-index: 8;
  }
  .softedge .se-light, .softedge .se-dark {
    position: absolute;
    inset: 0;
    transition: opacity .25s ease;
  }
  .softedge .se-light {
    background: linear-gradient(to bottom, rgba(255,255,255,.78) 0%, rgba(255,255,255,0) 92%);
    opacity: 1;
  }
  .softedge .se-dark {
    background: linear-gradient(to bottom, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 92%);
    opacity: 0;
  }
  .device.navdark .se-light { opacity: 0; }
  .device.navdark .se-dark { opacity: 1; }
  .softedge::after {
    content: '';
    position: absolute;
    inset: 0;
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
  }
  /* 리퀴드 글라스 재질 — 블러+채도 부스트+상하 인셋 하이라이트 */
  .glassbtn {
    position: absolute;
    top: 44px; right: 16px;
    width: 44px; height: 44px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9;
    background: rgba(255,255,255,.42);
    backdrop-filter: blur(18px) saturate(1.8);
    -webkit-backdrop-filter: blur(18px) saturate(1.8);
    box-shadow:
      inset 0 1px 1.5px rgba(255,255,255,.75),
      inset 0 -1px 1.5px rgba(0,0,0,.05),
      0 4px 14px rgba(0,0,0,.08);
  }
  canvas.topnav {
    position: absolute;
    top: 0; left: 0;
    width: 375px; height: 133px; /* 글래스 버튼 글로우가 88pt 아래까지 번짐 — 자르지 않음 */
    pointer-events: none;
    z-index: 10;
  }
  /* 타이틀·상태바 — 배경 밝기에 따라 black/white 적응형 전환 */
  .navtitle, .navstatus {
    position: absolute;
    z-index: 10;
    pointer-events: none;
    background: #111;
    transition: background-color .25s ease;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }
  .navtitle {
    left: 90px; top: 50px;
    width: 190px; height: 32px;
    -webkit-mask-size: 190px 32px;
    mask-size: 190px 32px;
  }
  .navstatus {
    left: 15px; top: 10px;
    width: 350px; height: 27.5px;
    -webkit-mask-size: 350px 27.5px;
    mask-size: 350px 27.5px;
  }
  .device.navdark .navtitle, .device.navdark .navstatus { background: #fff; }

  /* ── A안: 풀-너비 바 버튼 (원본 78pt, 익스포트 하단 그림자 번짐만 클립) ── */
  .barbtn {
    position: absolute;
    bottom: 0; left: 0;
    width: 375px; height: 78px;
    overflow: hidden;
    z-index: 20;
    cursor: pointer;
    will-change: transform, opacity;
  }
  .barbtn img { display: block; width: 100%; }

  /* ── B안: 플로팅 캡슐 버튼 (피그마 128:15776 / 128:15782 원본 값) ── */
  .pill {
    position: absolute;
    left: 50%; bottom: 25px;
    transform: translateX(-50%); /* JS 적용 전에도 중앙 — 새로고침 시 우측에서 밀려오는 현상 방지 */
    width: 201px;
    height: 46px;
    border-radius: 24px;
    background: #fff;
    color: #111;
    border: 1px solid rgba(0,0,0,0.04);
    filter: drop-shadow(0 2px 0.9px rgba(0,0,0,0.03));
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 20;
    will-change: transform, opacity;
  }
  .pill.green { background: #28C660; color: #fff; }
  /* 라벨은 피그마 텍스트 벡터 아웃라인 마스크 — 폰트 렌더링 차이 제거, 색은 currentColor */
  .pill .label {
    width: 163px; height: 14px;
    background: currentColor;
    -webkit-mask: url('assets/pill-label-clean.svg') center / 163px 14px no-repeat;
    mask: url('assets/pill-label-clean.svg') center / 163px 14px no-repeat;
  }

  /* ── 스크롤 존 (녹화 중에만, 녹화 중인 안을 조작) ── */
  .scrollzone {
    display: none;
    width: 72px;
    flex: 0 0 auto;
    align-self: stretch;
    background: var(--muted);
    border-radius: var(--radius-2xl);
    color: var(--muted-foreground);
    align-items: center; justify-content: center;
    writing-mode: vertical-rl;
    letter-spacing: .25em;
    font-size: 12px;
    user-select: none;
    cursor: ns-resize;
    touch-action: none;
  }
  body.recmode .scrollzone { display: flex; }
  .scrollzone:hover { color: var(--foreground); }

  /* ── 옵션 팝오버 (누른 안에 바인딩) ────── */
  .panel {
    position: fixed;
    width: 280px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 72px);
    overflow-y: auto;
    background: var(--popover);
    border: 1px solid var(--border);
    border-radius: var(--radius-3xl);
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
    padding: 18px;
    display: none;
    flex-direction: column;
    gap: 16px;
    z-index: 100;
  }
  .panel.open { display: flex; }
  .panel h2 { font-size: 14px; font-weight: 600; }
  .panel .saved { font-size: 11px; color: var(--muted-foreground); font-weight: 400; margin-left: 6px; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .group.b-only.hidden { display: none; }
  .group label { font-size: 12px; color: var(--muted-foreground); }
  .group label b { color: var(--foreground); font-weight: 600; }
  .seg {
    display: flex;
    background: var(--muted);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .seg button {
    flex: 1;
    border: 0;
    background: transparent;
    color: var(--muted-foreground);
    padding: 7px 0;
    border-radius: 999px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .seg button.on { background: var(--primary); color: var(--primary-foreground); font-weight: 600; }
  select {
    width: 100%;
    background: var(--background);
    color: var(--foreground);
    border: 1px solid var(--input);
    border-radius: var(--radius-xl);
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  input[type=range] { width: 100%; accent-color: var(--primary); }
  .status {
    background: var(--muted);
    border-radius: var(--radius-2xl);
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 6px;
    font-size: 12px;
  }
  .status .row { display: flex; justify-content: space-between; }
  .status .row span:first-child { color: var(--muted-foreground); }
  #stState.on  { color: var(--success); font-weight: 700; }
  #stState.off { color: var(--destructive); font-weight: 700; }
  .reset {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--foreground);
    border-radius: 999px;
    padding: 10px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .reset:hover { background: var(--accent); }
  .hint { font-size: 11px; color: var(--muted-foreground); line-height: 1.6; }
  .hint a { color: var(--foreground); }
</style>
</head>
<body>

<header class="topbar">
  <div class="title">MTK 2nd Depth Motion</div>
</header>

<main class="main">
  <div class="stage" id="stage">
    <div class="devicewrap" data-dev="A">
      <div class="devhead">
        <span class="caption">A. Full Width Bar</span>
        <span class="devbtns">
          <button class="iconbtn opt" data-opt="A" title="A안 모션 옵션">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="21" y1="4" x2="14" y2="4"/><line x1="10" y1="4" x2="3" y2="4"/>
              <line x1="21" y1="12" x2="12" y2="12"/><line x1="8" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="20" x2="16" y2="20"/><line x1="12" y1="20" x2="3" y2="20"/>
              <line x1="14" y1="2" x2="14" y2="6"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="16" y1="18" x2="16" y2="22"/>
            </svg>
          </button>
          <button class="iconbtn rec" data-rec="A" title="A안 녹화">
            <svg class="dot" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="12" r="4.5" fill="#FF334B"/>
            </svg>
            <svg class="stop" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="#FF334B" stroke-width="2"/>
              <rect x="8.5" y="8.5" width="7" height="7" rx="1.5" fill="#FF334B"/>
            </svg>
          </button>
        </span>
      </div>
      <div class="device">
        <div class="viewport" data-vp>
          <img class="content" src="assets/content.png" alt="" draggable="false">
        </div>
        <div class="softedge"><i class="se-light"></i><i class="se-dark"></i></div>
        <div class="glassbtn"></div>
        <canvas class="topnav" data-nav width="750" height="266"></canvas>
        <div class="navtitle" data-navtitle></div>
        <div class="navstatus" data-navstatus></div>
        <div class="barbtn" data-btn>
          <img src="assets/btmbtn.png" alt="Explore more on Home" draggable="false">
        </div>
      </div>
    </div>

    <div class="devicewrap" data-dev="B">
      <div class="devhead">
        <span class="caption">B. Capsule</span>
        <span class="devbtns">
          <button class="iconbtn opt" data-opt="B" title="B안 모션 옵션">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="21" y1="4" x2="14" y2="4"/><line x1="10" y1="4" x2="3" y2="4"/>
              <line x1="21" y1="12" x2="12" y2="12"/><line x1="8" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="20" x2="16" y2="20"/><line x1="12" y1="20" x2="3" y2="20"/>
              <line x1="14" y1="2" x2="14" y2="6"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="16" y1="18" x2="16" y2="22"/>
            </svg>
          </button>
          <button class="iconbtn rec" data-rec="B" title="B안 녹화">
            <svg class="dot" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="12" r="4.5" fill="#FF334B"/>
            </svg>
            <svg class="stop" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="#FF334B" stroke-width="2"/>
              <rect x="8.5" y="8.5" width="7" height="7" rx="1.5" fill="#FF334B"/>
            </svg>
          </button>
        </span>
      </div>
      <div class="device">
        <div class="viewport" data-vp>
          <img class="content" src="assets/content.png" alt="" draggable="false">
        </div>
        <div class="softedge"><i class="se-light"></i><i class="se-dark"></i></div>
        <div class="glassbtn"></div>
        <canvas class="topnav" data-nav width="750" height="266"></canvas>
        <div class="navtitle" data-navtitle></div>
        <div class="navstatus" data-navstatus></div>
        <button class="pill" data-btn aria-label="Explore more on Home"><span class="label"></span></button>
      </div>
    </div>

    <div class="scrollzone" id="zone">SCROLL · 여기서 스크롤</div>
  </div>
</main>

<div class="panel" id="panel">
  <h2><span id="panelTitle">A안</span> 모션 옵션<span class="saved">설정 자동 저장</span></h2>

  <div class="group">
    <label>모션 스타일</label>
    <div class="seg" id="segStyle">
      <button data-v="slide-fade">슬라이드+페이드</button>
      <button data-v="slide">슬라이드</button>
      <button data-v="fade">페이드</button>
    </div>
  </div>

  <div class="group">
    <label>듀레이션 <b id="durVal">260ms</b></label>
    <input type="range" id="dur" min="100" max="600" step="10" value="260">
  </div>

  <div class="group">
    <label>이징</label>
    <select id="ease">
      <option value="cubic-bezier(0.25, 0.1, 0.25, 1)">Ease (기본)</option>
      <option value="cubic-bezier(0, 0, 0.2, 1)">Ease-out (감속)</option>
      <option value="cubic-bezier(0.4, 0, 0.2, 1)">Standard (머티리얼)</option>
      <option value="cubic-bezier(0.34, 1.56, 0.64, 1)">Spring (오버슈트)</option>
      <option value="cubic-bezier(0.4, 0, 1, 1)">Ease-in (가속)</option>
    </select>
  </div>

  <div class="group b-only">
    <label>그린 전환</label>
    <div class="seg" id="segGreen">
      <button data-v="fade">페이드</button>
      <button data-v="pop">팝</button>
      <button data-v="swap">교체</button>
    </div>
  </div>

  <div class="group b-only">
    <label>그린 페이드 속도 <b id="gDurVal">250ms</b> <span style="color:var(--muted-foreground)">— 페이드 전용</span></label>
    <input type="range" id="gDur" min="100" max="600" step="10" value="250">
  </div>

  <div class="group">
    <label>반응 임계값 <b id="thVal">10pt</b></label>
    <input type="range" id="th" min="0" max="60" step="2" value="10">
  </div>

  <div class="status">
    <div class="row"><span>버튼 상태</span><span id="stState" class="on">ON</span></div>
    <div class="row"><span>스크롤 방향</span><span id="stDir">—</span></div>
    <div class="row"><span>스크롤 위치</span><span id="stPos">0 / 0</span></div>
  </div>

  <button class="reset" id="reset">맨 위로 리셋</button>

  <div class="hint">녹화(각 안의 ●)는 권한 팝업 없이 해당 화면을 750×1624로 바로 렌더링해요. 정지하면 .mp4 자동 저장 →
    <a href="http://localhost:5177" target="_blank">video-2mb</a>로 2MB 압축.</div>
</div>

<script>
  // ── 설정: 안별 저장/복원 ──
  const CFG_KEY = 'mkt-scroll-btn-cfg-v1';
  const DEFAULTS = {
    style: 'slide-fade',
    dur: 260,
    gDur: 250,
    greenStyle: 'pop',
    ease: 'cubic-bezier(0, 0, 0.2, 1)',
    threshold: 10,
  };
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch (e) {}
  const cfgs = {
    A: { ...DEFAULTS, ...(stored.A || {}) },
    B: { ...DEFAULTS, ...(stored.B || {}) },
  };
  function saveCfgs() { localStorage.setItem(CFG_KEY, JSON.stringify(cfgs)); }

  // ── 디바이스 모델 ──
  const devs = ['A', 'B'].map(id => {
    const wrap = document.querySelector(`[data-dev="${id}"]`);
    return {
      id,
      wrap,
      device: wrap.querySelector('.device'),
      vp: wrap.querySelector('[data-vp]'),
      btn: wrap.querySelector('[data-btn]'),
      navtitle: wrap.querySelector('[data-navtitle]'),
      navstatus: wrap.querySelector('[data-navstatus]'),
      seLight: wrap.querySelector('.se-light'),
      seDark: wrap.querySelector('.se-dark'),
      contentImg: wrap.querySelector('.content'),
      cfg: cfgs[id],
      shown: true, isBottom: false, lastY: 0, acc: 0, navDark: false,
    };
  });
  const devA = devs[0], devB = devs[1];
  let active = devA;   // 옵션 패널이 바인딩된 안

  function applyTransition(dev) {
    const c = dev.cfg;
    const t = `transform ${c.dur}ms ${c.ease}, opacity ${c.dur}ms ${c.ease}`;
    if (dev.id === 'B') {
      const colorDur = c.greenStyle === 'fade' ? c.gDur : c.greenStyle === 'pop' ? 160 : 0;
      dev.btn.style.transition = `${t}, background-color ${colorDur}ms ease, color ${colorDur}ms ease`;
    } else {
      dev.btn.style.transition = t;
    }
  }

  function render(dev) {
    const c = dev.cfg;
    const slide = c.style !== 'fade';
    const hideOp = c.style === 'slide' ? 1 : 0;
    if (dev.id === 'A') {
      dev.btn.style.transform = `translateY(${dev.shown ? 0 : slide ? '100%' : '0'})`;
    } else {
      dev.btn.style.transform = `translateX(-50%) translateY(${dev.shown ? 0 : slide ? 100 : 0}px)`;
    }
    dev.btn.style.opacity = dev.shown ? 1 : hideOp;
    if (dev === active) updateStatus();
  }

  function updateStatus() {
    const st = document.getElementById('stState');
    st.textContent = active.shown ? (active.id === 'B' && active.isBottom ? 'ON · GREEN' : 'ON') : 'OFF';
    st.className = active.shown ? 'on' : 'off';
  }

  function setShown(dev, v) {
    if (dev.shown === v) return;
    dev.shown = v;
    render(dev);
  }

  // ── B안 그린 전환: 페이드 / 팝 / 교체 ──
  function setBottom(dev, v) {
    if (dev.isBottom === v) return;
    dev.isBottom = v;
    if (dev.id === 'B') {
      const pill = dev.btn;
      if (!dev.shown) {
        // 버튼이 숨겨진 상태면 색은 즉시 교체(등장 시 흰→그린 깜빡임 방지),
        // 그린으로 등장하는 경우엔 도착 타이밍에 팝 펀치를 얹음
        pill.style.transition = 'none';
        pill.classList.toggle('green', v);
        void pill.offsetWidth; // 리플로우로 즉시 적용 확정
        applyTransition(dev);
        if (v && dev.cfg.greenStyle === 'pop') {
          pill.animate(
            [{ transform: 'scale(1)' }, { transform: 'scale(0.96)' }, { transform: 'scale(1)' }],
            { delay: Math.min(dev.cfg.dur * 0.7, 250), duration: 300,
              easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)', composite: 'add' });
        }
      } else if (dev.cfg.greenStyle === 'swap') {
        // 교체: 살짝 내려가며 사라지고, 새 색으로 아래에서 다시 올라옴
        const out1 = pill.animate([{ opacity: 1 }, { opacity: 0 }],
          { duration: 130, easing: 'ease-in', fill: 'forwards' });
        const out2 = pill.animate([{ transform: 'translateY(0px)' }, { transform: 'translateY(14px)' }],
          { duration: 130, easing: 'ease-in', composite: 'add', fill: 'forwards' });
        out1.onfinish = () => {
          pill.classList.toggle('green', v);
          requestAnimationFrame(() => {
            out1.cancel(); out2.cancel();
            pill.animate([{ opacity: 0 }, { opacity: 1 }],
              { duration: 220, easing: 'ease-out' });
            pill.animate([{ transform: 'translateY(16px)' }, { transform: 'translateY(0px)' }],
              { duration: 220, easing: 'cubic-bezier(0, 0, 0.2, 1)', composite: 'add' });
          });
        };
      } else {
        pill.classList.toggle('green', v);
        if (dev.cfg.greenStyle === 'pop') {
          // 팝: 색 전환 + 스케일 펀치로 "도달" 이벤트감
          pill.animate(
            [{ transform: 'scale(1)' }, { transform: 'scale(0.96)' }, { transform: 'scale(1)' }],
            { duration: 300, easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)', composite: 'add' });
        }
      }
    }
    if (dev === active) updateStatus();
  }

  // ── 독립 스크롤 + 안별 상태 머신 ──
  function handleScroll(dev) {
    const y = dev.vp.scrollTop;
    const d = y - dev.lastY;
    dev.lastY = y;

    const max = dev.vp.scrollHeight - dev.vp.clientHeight;
    const atBottom = y >= max - 2;
    const atTop = y <= 2;

    if (dev === active) {
      document.getElementById('stPos').textContent = `${Math.round(y)} / ${Math.round(max)}`;
      if (d !== 0) document.getElementById('stDir').textContent = d > 0 ? '↓ 아래로' : '↑ 위로';
    }

    updateTitleColor(dev);
    setBottom(dev, atBottom);

    if (atBottom || atTop) { setShown(dev, true); dev.acc = 0; return; }

    // 방향이 바뀌면 누적량 리셋
    if ((d > 0) !== (dev.acc > 0)) dev.acc = 0;
    dev.acc += d;

    if (dev.acc > dev.cfg.threshold) setShown(dev, false);
    else if (dev.acc < -dev.cfg.threshold) setShown(dev, true);
  }
  devs.forEach(dev => dev.vp.addEventListener('scroll', () => handleScroll(dev), { passive: true }));

  // ── 옵션 팝오버: 누른 안에 바인딩 ──
  const panel = document.getElementById('panel');
  function syncPanel() {
    const c = active.cfg;
    document.getElementById('panelTitle').textContent = active.id + '안';
    document.querySelectorAll('#segStyle button').forEach(b => b.classList.toggle('on', b.dataset.v === c.style));
    document.querySelectorAll('#segGreen button').forEach(b => b.classList.toggle('on', b.dataset.v === c.greenStyle));
    document.getElementById('dur').value = c.dur;
    document.getElementById('durVal').textContent = c.dur + 'ms';
    document.getElementById('gDur').value = c.gDur;
    document.getElementById('gDurVal').textContent = c.gDur + 'ms';
    document.getElementById('ease').value = c.ease;
    document.getElementById('th').value = c.threshold;
    document.getElementById('thVal').textContent = c.threshold + 'pt';
    document.querySelectorAll('.b-only').forEach(g => g.classList.toggle('hidden', active.id !== 'B'));
    const y = active.vp.scrollTop, max = active.vp.scrollHeight - active.vp.clientHeight;
    document.getElementById('stPos').textContent = `${Math.round(y)} / ${Math.round(max)}`;
    updateStatus();
  }
  document.querySelectorAll('[data-opt]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const dev = btn.dataset.opt === 'A' ? devA : devB;
      if (panel.classList.contains('open') && active === dev) {
        panel.classList.remove('open');
      } else {
        active = dev;
        syncPanel();
        const r = btn.getBoundingClientRect();
        panel.style.top = Math.min(r.bottom + 8, innerHeight - 200) + 'px';
        panel.style.left = Math.max(16, Math.min(r.right - 280, innerWidth - 296)) + 'px';
        panel.classList.add('open');
      }
      document.querySelectorAll('[data-opt]').forEach(b =>
        b.classList.toggle('active', panel.classList.contains('open') && b.dataset.opt === active.id));
    });
  });
  document.addEventListener('click', e => {
    if (panel.classList.contains('open') && !panel.contains(e.target)) {
      panel.classList.remove('open');
      document.querySelectorAll('[data-opt]').forEach(b => b.classList.remove('active'));
    }
  });

  document.getElementById('segStyle').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    active.cfg.style = b.dataset.v;
    document.querySelectorAll('#segStyle button').forEach(x => x.classList.toggle('on', x === b));
    render(active); saveCfgs();
  });
  document.getElementById('segGreen').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    active.cfg.greenStyle = b.dataset.v;
    document.querySelectorAll('#segGreen button').forEach(x => x.classList.toggle('on', x === b));
    applyTransition(active); saveCfgs();
  });
  document.getElementById('dur').addEventListener('input', e => {
    active.cfg.dur = +e.target.value;
    document.getElementById('durVal').textContent = active.cfg.dur + 'ms';
    applyTransition(active); saveCfgs();
  });
  document.getElementById('gDur').addEventListener('input', e => {
    active.cfg.gDur = +e.target.value;
    document.getElementById('gDurVal').textContent = active.cfg.gDur + 'ms';
    applyTransition(active); saveCfgs();
  });
  document.getElementById('ease').addEventListener('change', e => {
    active.cfg.ease = e.target.value;
    applyTransition(active); saveCfgs();
  });
  document.getElementById('th').addEventListener('input', e => {
    active.cfg.threshold = +e.target.value;
    document.getElementById('thVal').textContent = active.cfg.threshold + 'pt';
    saveCfgs();
  });
  document.getElementById('reset').addEventListener('click', () => {
    active.vp.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ── 네비 화이트 키잉 + 타이틀 잉크 분리 ──
  // (피그마 익스포트가 배경까지 통짜 화이트로 구워져서 런타임에 분리)
  const TITLE = { x: 180, y: 100, w: 380, h: 64 };  // 타이틀 잉크 영역 (2x px)
  const STATUS = { x: 30, y: 20, w: 700, h: 55 };   // 상태바 잉크 영역 (2x px)
  (async () => {
    const img = new Image();
    img.src = 'assets/topnav.png';
    await img.decode();
    const work = document.createElement('canvas');
    work.width = 750; work.height = 266;
    const wctx = work.getContext('2d');
    wctx.drawImage(img, 0, 0);
    const im = wctx.getImageData(0, 0, 750, 266);
    const d = im.data;
    for (let i = 0; i < d.length; i += 4) {
      const a = 255 - Math.min(d[i], d[i + 1], d[i + 2]); // 흰 배경 기준 알파 복원
      if (a < 6) { d[i + 3] = 0; continue; }
      d[i]     = Math.max(0, Math.round((d[i]     - (255 - a)) * 255 / a));
      d[i + 1] = Math.max(0, Math.round((d[i + 1] - (255 - a)) * 255 / a));
      d[i + 2] = Math.max(0, Math.round((d[i + 2] - (255 - a)) * 255 / a));
      d[i + 3] = a;
    }
    wctx.putImageData(im, 0, 0);
    // 타이틀·상태바 잉크만 떼어 마스크로 (적응형 컬러 전환용)
    const cut = region => {
      const cc = document.createElement('canvas');
      cc.width = region.w; cc.height = region.h;
      cc.getContext('2d').drawImage(work, region.x, region.y, region.w, region.h, 0, 0, region.w, region.h);
      return cc;
    };
    const titleInk = cut(TITLE);
    const statusInk = cut(STATUS);
    const titleMask = `url(${titleInk.toDataURL()})`;
    const statusMask = `url(${statusInk.toDataURL()})`;
    devs.forEach(dev => {
      dev.navtitle.style.webkitMaskImage = titleMask;
      dev.navtitle.style.maskImage = titleMask;
      dev.navstatus.style.webkitMaskImage = statusMask;
      dev.navstatus.style.maskImage = statusMask;
    });
    // 본 캔버스에서는 해당 영역 제거 (중복 방지)
    wctx.clearRect(TITLE.x, TITLE.y, TITLE.w, TITLE.h);
    wctx.clearRect(STATUS.x, STATUS.y, STATUS.w, STATUS.h);
    const im2 = wctx.getImageData(0, 0, 750, 266);
    document.querySelectorAll('[data-nav]').forEach(c => c.getContext('2d').putImageData(im2, 0, 0));
    navAssets = { ink: work, title: titleInk, status: statusInk }; // 캔버스 녹화용
  })();

  // ── 타이틀 적응형 컬러: 뒤 배경 밝기 샘플링 → 대비 높은 쪽 선택 ──
  let rowLum = null;
  (async () => {
    const img = new Image();
    img.src = 'assets/content.png';
    await img.decode();
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    const band = ctx.getImageData(TITLE.x, 0, TITLE.w, img.height).data;
    rowLum = new Float32Array(img.height);
    const step = 4;
    const cols = Math.ceil(TITLE.w / step);
    for (let y = 0; y < img.height; y++) {
      let s = 0;
      for (let x = 0; x < TITLE.w; x += step) {
        const o = (y * TITLE.w + x) * 4;
        s += band[o] * 0.299 + band[o + 1] * 0.587 + band[o + 2] * 0.114;
      }
      rowLum[y] = s / cols;
    }
    devs.forEach(updateTitleColor);
  })();
  function updateTitleColor(dev) {
    if (!rowLum) return;
    // 네비 구간(10~80pt) 뒤 콘텐츠 행 밝기 평균 (콘텐츠는 98pt부터 시작)
    const scrollTop = dev.vp.scrollTop;
    let sum = 0, n = 0;
    for (let pt = 10; pt <= 80; pt += 4) {
      const cy = Math.round((scrollTop + pt - 98) * 2);
      sum += (cy < 0 || cy >= rowLum.length) ? 255 : rowLum[cy];
      n++;
    }
    const lum = sum / n;
    // 히스테리시스로 경계에서 깜빡임 방지
    if (dev.navDark && lum > 165) dev.navDark = false;
    else if (!dev.navDark && lum < 140) dev.navDark = true;
    // 타이틀·상태바 잉크 white ↔ black, 배경 그라디언트는 반대색으로
    dev.device.classList.toggle('navdark', dev.navDark);
  }

  // ── 스크롤 존: 녹화 중인 안을 조작 ──
  const zone = document.getElementById('zone');
  let recDev = null;
  zone.addEventListener('wheel', e => {
    e.preventDefault();
    if (recDev) recDev.vp.scrollTop += e.deltaY;
  }, { passive: false });
  let dragging = false, lastPY = 0;
  zone.addEventListener('pointerdown', e => {
    dragging = true; lastPY = e.clientY;
    zone.setPointerCapture(e.pointerId);
  });
  zone.addEventListener('pointermove', e => {
    if (!dragging || !recDev) return;
    recDev.vp.scrollTop -= (e.clientY - lastPY) / curScale;
    lastPY = e.clientY;
  });
  zone.addEventListener('pointerup', () => dragging = false);

  // ── 화면 녹화: 디바이스를 캔버스에 직접 렌더링해 mp4 저장 (캡처 권한 불필요) ──
  let navAssets = null;
  const labelImg = new Image();
  labelImg.src = 'assets/pill-label-clean.svg';

  function toast(msg) {
    let t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      t.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;z-index:200;transition:opacity .3s;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = 1;
    clearTimeout(t._h);
    t._h = setTimeout(() => t.style.opacity = 0, 2600);
  }

  function tintInk(srcCanvas, color) {
    const c = document.createElement('canvas');
    c.width = srcCanvas.width; c.height = srcCanvas.height;
    const x = c.getContext('2d');
    x.drawImage(srcCanvas, 0, 0);
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = color;
    x.fillRect(0, 0, c.width, c.height);
    return c;
  }

  function makeGrad(ctx, stops) {
    const g = ctx.createLinearGradient(0, 0, 0, 176);
    stops.forEach(([o, col]) => g.addColorStop(o, col));
    return g;
  }

  function drawDeviceFrame(dev, ctx, sc) {
    const devRect = dev.device.getBoundingClientRect();
    const toPx = r => ({
      x: (r.left - devRect.left) / curScale * 2,
      y: (r.top - devRect.top) / curScale * 2,
      w: r.width / curScale * 2,
      h: r.height / curScale * 2,
    });
    // 1) 배경 + 콘텐츠
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, 750, 1624);
    ctx.drawImage(dev.contentImg, 0, Math.round((98 - dev.vp.scrollTop) * 2));
    // 2) 소프트 엣지: 점진 블러 (상→하 페이드 마스크)
    const bx = sc.blur.getContext('2d');
    bx.clearRect(0, 0, 750, 176);
    bx.filter = 'blur(24px) saturate(1.4)';
    bx.drawImage(ctx.canvas, 0, 0, 750, 176, 0, 0, 750, 176);
    bx.filter = 'none';
    bx.globalCompositeOperation = 'destination-in';
    bx.fillStyle = sc.maskGrad;
    bx.fillRect(0, 0, 750, 176);
    bx.globalCompositeOperation = 'source-over';
    ctx.drawImage(sc.blur, 0, 0);
    // 3) 그라디언트 틴트 (라이트/다크 크로스페이드 현재값 반영)
    const seL = +getComputedStyle(dev.seLight).opacity;
    const seD = +getComputedStyle(dev.seDark).opacity;
    if (seL > 0) { ctx.globalAlpha = seL; ctx.fillStyle = sc.gradLight; ctx.fillRect(0, 0, 750, 176); }
    if (seD > 0) { ctx.globalAlpha = seD; ctx.fillStyle = sc.gradDark; ctx.fillRect(0, 0, 750, 176); }
    ctx.globalAlpha = 1;
    // 4) 글라스 X 버튼 (블러 근사: 뒤 영역 블러 + 화이트 틴트, 원형 클립)
    const gx = sc.glass.getContext('2d');
    gx.clearRect(0, 0, 88, 88);
    gx.filter = 'blur(14px) saturate(1.8)';
    gx.drawImage(ctx.canvas, 630, 88, 88, 88, 0, 0, 88, 88);
    gx.filter = 'none';
    gx.fillStyle = 'rgba(255,255,255,.42)';
    gx.fillRect(0, 0, 88, 88);
    ctx.save();
    ctx.beginPath();
    ctx.arc(674, 132, 44, 0, 7);
    ctx.clip();
    ctx.drawImage(sc.glass, 630, 88);
    ctx.restore();
    // 5) 네비 잉크 + 타이틀/상태바 (현재 적응형 색)
    if (navAssets) {
      ctx.drawImage(navAssets.ink, 0, 0);
      const col = getComputedStyle(dev.navtitle).backgroundColor;
      ctx.drawImage(tintInk(navAssets.title, col), 180, 100);
      ctx.drawImage(tintInk(navAssets.status, col), 30, 20);
    }
    // 6) 하단 버튼 (전환 중간값 포함 — 실제 렌더 rect/스타일 그대로)
    const cs = getComputedStyle(dev.btn);
    const op = +cs.opacity;
    if (op <= 0.003) return;
    const r = toPx(dev.btn.getBoundingClientRect());
    ctx.globalAlpha = op;
    if (dev.id === 'A') {
      ctx.drawImage(dev.btn.querySelector('img'), 0, 0, 750, 156, r.x, r.y, r.w, r.h);
    } else {
      const rad = Math.min(r.h, r.w) * (48 / 92);
      ctx.fillStyle = cs.backgroundColor;
      ctx.beginPath();
      ctx.roundRect(r.x, r.y, r.w, r.h, rad);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.04)';
      ctx.lineWidth = 2;
      ctx.stroke();
      if (labelImg.complete && labelImg.naturalWidth) {
        const lw = 326 * (r.w / 402), lh = 28 * (r.h / 92);
        const lc = document.createElement('canvas');
        lc.width = Math.max(1, Math.round(lw)); lc.height = Math.max(1, Math.round(lh));
        const lx = lc.getContext('2d');
        lx.drawImage(labelImg, 0, 0, lc.width, lc.height);
        lx.globalCompositeOperation = 'source-in';
        lx.fillStyle = cs.color;
        lx.fillRect(0, 0, lc.width, lc.height);
        ctx.drawImage(lc, r.x + (r.w - lc.width) / 2, r.y + (r.h - lc.height) / 2);
      }
    }
    ctx.globalAlpha = 1;
  }

  let recorder = null, chunks = [], recRaf = 0;
  function setRecUI(dev, on) {
    recDev = on ? dev : null;
    document.body.classList.toggle('recmode', on);
    dev.device.classList.toggle('recording', on);
    devs.forEach(x => {
      const b = x.wrap.querySelector('[data-rec]');
      b.classList.toggle('recording', on && x === dev);
      b.disabled = on && x !== dev;
      b.title = on && x === dev ? '녹화 정지 (저장)' : `${x.id}안 녹화`;
    });
    fit();
  }
  document.querySelectorAll('[data-rec]').forEach(btn => {
    btn.addEventListener('click', () => {
      const dev = btn.dataset.rec === 'A' ? devA : devB;
      if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
      try {
        const cnv = document.createElement('canvas');
        cnv.width = 750; cnv.height = 1624;
        const ctx = cnv.getContext('2d');
        const blur = document.createElement('canvas'); blur.width = 750; blur.height = 176;
        const glass = document.createElement('canvas'); glass.width = 88; glass.height = 88;
        const bctx = blur.getContext('2d');
        const sc = {
          blur, glass,
          maskGrad: makeGrad(bctx, [[0, 'rgba(0,0,0,1)'], [1, 'rgba(0,0,0,0)']]),
          gradLight: makeGrad(ctx, [[0, 'rgba(255,255,255,.78)'], [0.92, 'rgba(255,255,255,0)'], [1, 'rgba(255,255,255,0)']]),
          gradDark: makeGrad(ctx, [[0, 'rgba(0,0,0,.5)'], [0.92, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0)']]),
        };
        const stream = cnv.captureStream(60);
        const mime = [
          'video/mp4;codecs=avc1.640028', // mp4 우선(맥 미리보기·위키 첨부 호환)
          'video/mp4',
          'video/webm;codecs=vp9',
          'video/webm',
        ].find(t => MediaRecorder.isTypeSupported(t));
        const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
        chunks = [];
        recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12_000_000 });
        recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        recorder.onerror = e => { toast('녹화 오류: ' + (e.error && e.error.message || '알 수 없음')); recorder.stop(); };
        recorder.onstop = () => {
          cancelAnimationFrame(recRaf);
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(chunks, { type: mime });
          if (!blob.size) { toast('녹화 데이터가 비어 있어요 — 다시 시도해 주세요'); }
          else {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            const t = new Date();
            const pad = n => String(n).padStart(2, '0');
            a.download = `scroll-motion-${dev.id}-${pad(t.getMonth() + 1)}${pad(t.getDate())}-${pad(t.getHours())}${pad(t.getMinutes())}${pad(t.getSeconds())}.${ext}`;
            a.click();
            toast(`${dev.id}안 녹화 저장 완료 (${(blob.size / 1048576).toFixed(1)}MB ${ext})`);
          }
          recorder = null;
          setRecUI(dev, false);
        };
        const loop = () => {
          if (!recorder || recorder.state !== 'recording') return;
          drawDeviceFrame(dev, ctx, sc);
          recRaf = requestAnimationFrame(loop);
        };
        recorder.start();
        setRecUI(dev, true);
        loop();
        toast(`${dev.id}안 녹화 중 — 다시 누르면 저장돼요`);
      } catch (err) {
        setRecUI(dev, false);
        toast('녹화를 시작하지 못했어요: ' + err.message);
      }
    });
  });

  // ── 창 크기에 맞춰 스테이지 축소 ──
  const stage = document.getElementById('stage');
  const HEAD_H = 36 + 4; // devhead + 간격
  let curScale = 1;
  function fit() {
    const zoneW = document.body.classList.contains('recmode') ? 24 + 72 : 0;
    const stageW = 375 * 2 + 56 + zoneW;
    const stageH = 812 + HEAD_H;
    const topH = document.querySelector('.topbar').offsetHeight;
    let s = innerWidth < 700
      ? Math.min(1, (innerHeight - topH - innerHeight * 0.05) / stageH) /* 모바일: 높이 기준, 가로는 스와이프 */
      : Math.min(1, (innerWidth - 40) / stageW, (innerHeight - topH - innerHeight * 0.04 - 8) / stageH);
    // 375pt 폭이 디바이스 픽셀에 딱 떨어지게 스냅 — 우측 1px 흰 라인(서브픽셀 틈) 방지
    const q = 375 * (devicePixelRatio || 1);
    s = Math.floor(s * q) / q;
    curScale = s;
    stage.style.transform = `scale(${s})`;
    stage.style.width = stageW * s + 'px';
    stage.style.height = stageH * s + 'px';
    stage.style.transformOrigin = 'top left';
  }
  addEventListener('resize', fit);
  fit();

  devs.forEach(dev => { dev.btn.style.transition = 'none'; render(dev); });
  requestAnimationFrame(() => devs.forEach(applyTransition));
</script>
</body>
</html>
